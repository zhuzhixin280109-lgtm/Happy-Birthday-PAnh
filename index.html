<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chúc mừng sinh nhật Phương Anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cake-scale: 1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000000;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    canvas#space {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Nhãn dán con mèo trắng tỏa tim ở góc */
    .corner-sticker {
      position: fixed;
      top: clamp(10px, 2.4dvh, 20px);
      right: clamp(10px, 2.8vw, 22px);
      z-index: 12;
      width: clamp(68px, 15vw, 88px);
      height: clamp(68px, 15vw, 88px);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      filter: drop-shadow(0 6px 16px rgba(255, 255, 255, 0.25)) drop-shadow(0 4px 12px rgba(255, 143, 171, 0.25));
    }

    .cat-badge {
      position: relative;
      width: 50px;
      height: 48px;
      border-radius: 20px 20px 18px 18px;
      background: linear-gradient(160deg, #ffffff 0%, #fdfbff 62%, #f3f0f8 100%);
      border: 2px solid #ffffff;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35), inset 0 -3px 6px rgba(203, 213, 225, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(6deg);
      animation: catHop 2.4s ease-in-out infinite alternate;
    }

    .cat-ear {
      position: absolute;
      top: -11px;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 13px solid #ffffff;
      filter: drop-shadow(0 -1.5px 0 #f8fafc);
    }

    .cat-ear::after {
      content: "";
      position: absolute;
      top: 4px;
      left: -4px;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 7px solid #ff9ebb;
    }

    .cat-ear.left {
      left: 4px;
      transform: rotate(-16deg);
    }

    .cat-ear.right {
      right: 4px;
      transform: rotate(16deg);
    }

    .cat-face {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 3px;
    }

    .cat-eyes {
      display: flex;
      gap: 13px;
      margin-bottom: 1px;
    }

    .cat-eyes span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #2b2630;
      box-shadow: 1px -1px 0 rgba(255, 255, 255, 0.9) inset;
    }

    .cat-cheeks {
      position: absolute;
      top: 23px;
      left: 5px;
      right: 5px;
      display: flex;
      justify-content: space-between;
    }

    .cat-cheeks span {
      width: 7px;
      height: 4px;
      border-radius: 999px;
      background: #ff8fab;
      opacity: 0.55;
    }

    .cat-whiskers {
      position: absolute;
      top: 25px;
      left: -5px;
      right: -5px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .cat-whiskers .w-side {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .cat-whiskers .w-side span {
      width: 7px;
      height: 1.2px;
      background: #94a3b8;
      opacity: 0.75;
      border-radius: 999px;
    }

    .cat-nose-mouth {
      font-size: 9px;
      line-height: 1;
      color: #e05780;
      font-weight: 700;
    }

    .aura-heart {
      position: absolute;
      font-size: var(--ah-size, 13px);
      color: var(--ah-color, #ff8fab);
      text-shadow: 0 0 10px rgba(255, 143, 171, 0.75);
      opacity: 0;
      animation: auraHeartRadiate var(--ah-dur, 2.2s) ease-out infinite;
      animation-delay: var(--ah-delay, 0s);
    }

    .aura-heart.h1 { top: -4px; left: 2px; --ah-tx: -14px; --ah-ty: -16px; --ah-size: 13px; --ah-color: #ff8fab; --ah-delay: 0s; }
    .aura-heart.h2 { top: -6px; right: 2px; --ah-tx: 15px; --ah-ty: -15px; --ah-size: 14px; --ah-color: #ffc6ff; --ah-delay: 0.45s; }
    .aura-heart.h3 { bottom: 4px; left: -4px; --ah-tx: -16px; --ah-ty: 8px; --ah-size: 12px; --ah-color: #ffe699; --ah-delay: 0.9s; }
    .aura-heart.h4 { bottom: 2px; right: -4px; --ah-tx: 16px; --ah-ty: 10px; --ah-size: 13px; --ah-color: #ff758f; --ah-delay: 1.35s; }
    .aura-heart.h5 { top: 22px; left: -7px; --ah-tx: -18px; --ah-ty: -4px; --ah-size: 11px; --ah-color: #ffd6e0; --ah-delay: 1.75s; }

    @keyframes auraHeartRadiate {
      0% {
        transform: translate(0, 0) scale(0.4);
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      100% {
        transform: translate(var(--ah-tx, -12px), var(--ah-ty, -14px)) scale(1.25);
        opacity: 0;
      }
    }

    @keyframes catHop {
      0%   { transform: rotate(5deg) translateY(0); }
      100% { transform: rotate(8deg) translateY(-4px); }
    }

    /* Lớp tim bay xuyên suốt */
    .heart-layer {
      position: fixed;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -36px;
      font-size: var(--h-size, 18px);
      color: var(--h-color, #ff8fab);
      text-shadow: 0 0 12px var(--h-glow, rgba(255, 143, 171, 0.55));
      opacity: 0;
      animation: heartFloatUp var(--h-dur, 5.2s) linear forwards;
    }

    @keyframes heartFloatUp {
      0% {
        transform: translateY(0) translateX(0) scale(0.75) rotate(-8deg);
        opacity: 0;
      }
      15% {
        opacity: 0.92;
      }
      50% {
        transform: translateY(-52dvh) translateX(var(--h-sway, 14px)) scale(1.05) rotate(8deg);
      }
      85% {
        opacity: 0.78;
      }
      100% {
        transform: translateY(-112dvh) translateX(calc(var(--h-sway, 14px) * -0.5)) scale(0.9) rotate(-6deg);
        opacity: 0;
      }
    }

    /* Giai đoạn 1: Nút mở đầu + các câu dẫn */
    .intro-stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 5vw, 32px);
      text-align: center;
      transition: opacity 0.85s ease;
    }

    .intro-line {
      font-family: "Quicksand", system-ui, sans-serif;
      font-size: clamp(1.3rem, 5vw, 2.6rem);
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.25);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      width: min(780px, 92vw);
      line-height: 1.5;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .intro-line.show {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal-btn {
      font-family: "Quicksand", system-ui, sans-serif;
      padding: clamp(12px, 3vw, 15px) clamp(22px, 5vw, 30px);
      border-radius: 999px;
      border: 1.5px solid rgba(255, 230, 153, 0.65);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: clamp(0.98rem, 3.8vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      max-width: 90vw;
      line-height: 1.4;
      box-shadow: 0 0 24px rgba(255, 214, 224, 0.25);
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 0.7s ease, transform 0.3s ease, background 0.3s ease, color 0.3s ease;
    }

    .reveal-btn.show {
      opacity: 1;
      transform: scale(1);
    }

    .reveal-btn.show:hover {
      background: linear-gradient(90deg, #ffd6e0, #ffe699, #bde0fe);
      color: #090a0f;
      border-color: transparent;
      transform: scale(1.05);
    }

    /* Giai đoạn 2: HAPPY BIRTHDAY to đùng nhấp nháy */
    .hbd-flash-stage {
      position: fixed;
      inset: 0;
      z-index: 9;
      background: transparent;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.85s ease;
    }

    .hbd-flash-stage.active {
      display: flex;
      opacity: 1;
    }

    .hbd-big-blink {
      position: relative;
      z-index: 2;
      font-family: "Quicksand", system-ui, sans-serif;
      font-size: clamp(2.3rem, 9.5vw, 8rem);
      font-weight: 700;
      letter-spacing: clamp(1px, 0.5vw, 3px);
      line-height: 1.12;
      max-width: 94vw;
      overflow-wrap: break-word;
      word-break: break-word;
      background: linear-gradient(90deg, #ffd6e0, #ffe699, #bde0fe, #ffc6ff, #ffd6e0);
      background-size: 250% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: blinkPulse 0.55s ease-in-out infinite alternate, shine 4s linear infinite;
      filter: drop-shadow(0 0 28px rgba(255, 214, 224, 0.45));
    }

    /* Giai đoạn 2.2: 17+ nhấp nháy to đùng + pháo hoa bùm bùm đằng sau */
    .age-flash-stage {
      position: fixed;
      inset: 0;
      z-index: 9;
      background: transparent;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.85s ease;
    }

    .age-flash-stage.active {
      display: flex;
      opacity: 1;
    }

    .age-big-blink {
      position: relative;
      z-index: 2;
      font-family: "Quicksand", system-ui, sans-serif;
      font-size: clamp(4.2rem, 18vw, 11rem);
      font-weight: 700;
      letter-spacing: 4px;
      line-height: 1.05;
      max-width: 94vw;
      background: linear-gradient(90deg, #ffd6e0, #ffe699, #bde0fe, #ffc6ff, #ffd6e0);
      background-size: 250% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: blinkPulse 0.45s ease-in-out infinite alternate, shine 3.5s linear infinite;
      filter: drop-shadow(0 0 34px rgba(255, 230, 153, 0.55));
    }

    @keyframes blinkPulse {
      0%   { opacity: 0.25; transform: scale(0.95); }
      100% { opacity: 1;    transform: scale(1.06); }
    }

    /* Bóng bay bay lên */
    .balloon-layer {
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      overflow: hidden;
    }

    .balloon-layer.interactive-pop {
      pointer-events: auto;
    }

    .balloon {
      position: absolute;
      bottom: -140px;
      width: var(--size, 52px);
      height: calc(var(--size, 52px) * 1.22);
      border-radius: 50% 50% 46% 46% / 44% 44% 56% 56%;
      background: radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.55), var(--color, #ff8fab) 48%, rgba(0, 0, 0, 0.22) 100%);
      box-shadow: inset -6px -8px 14px rgba(0, 0, 0, 0.18), 0 0 18px var(--glow, rgba(255, 143, 171, 0.35));
      opacity: 0.92;
      animation: balloonRise var(--dur, 5.5s) ease-in forwards;
    }

    .balloon.poppable {
      cursor: pointer;
      pointer-events: auto;
    }

    .balloon::before {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 7px;
      border-radius: 3px;
      background: var(--color, #ff8fab);
    }

    .balloon::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 1.5px;
      height: 54px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.05));
    }

    .pop-burst {
      position: fixed;
      width: 12px;
      height: 12px;
      margin-left: -6px;
      margin-top: -6px;
      border-radius: 50%;
      background: var(--pop-color, #ff8fab);
      box-shadow: 0 0 12px var(--pop-color, #ff8fab);
      pointer-events: none;
      z-index: 11;
      animation: popParticle 0.55s ease-out forwards;
    }

    @keyframes popParticle {
      0% {
        transform: translate(0, 0) scale(1.1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--px, 24px), var(--py, -24px)) scale(0.1);
        opacity: 0;
      }
    }

    @keyframes balloonRise {
      0% {
        transform: translateY(0) translateX(0) rotate(-3deg);
        opacity: 0;
      }
      12% {
        opacity: 0.94;
      }
      50% {
        transform: translateY(-55dvh) translateX(var(--sway, 18px)) rotate(4deg);
      }
      88% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-122dvh) translateX(calc(var(--sway, 18px) * -0.6)) rotate(-3deg);
        opacity: 0;
      }
    }

    /* Giai đoạn 2.5: Chiếc bánh kem 17 cây nến tự co giãn theo màn hình */
    .cake-stage {
      position: fixed;
      inset: 0;
      z-index: 8;
      background: transparent;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.85s ease;
    }

    .cake-stage.active {
      display: flex;
      opacity: 1;
    }

    .cake-title {
      font-family: "Quicksand", system-ui, sans-serif;
      font-size: clamp(1.35rem, 4.5vw, 2.55rem);
      font-weight: 700;
      color: #ffe699;
      margin-bottom: clamp(24px, 5.5dvh, 48px);
      text-shadow: 0 0 18px rgba(255, 230, 153, 0.35);
    }

    .cake-scale-box {
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(300px * var(--cake-scale));
    }

    .big-cake {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transform: scale(var(--cake-scale));
      transform-origin: center center;
      transition: transform 0.25s ease;
      filter: drop-shadow(0 16px 32px rgba(0, 0, 0, 0.7));
    }

    .big-cake:hover {
      transform: scale(calc(var(--cake-scale) * 1.03));
    }

    /* Dàn 17 cây nến trên mặt bánh */
    .candles-row {
      position: relative;
      z-index: 4;
      width: 214px;
      height: 52px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 6px;
      margin-bottom: -4px;
    }

    .mini-candle {
      width: 8px;
      height: var(--h, 36px);
      border-radius: 4px 4px 2px 2px;
      position: relative;
      transform: translateY(var(--y-off, 0px));
      background: repeating-linear-gradient(
        135deg,
        #fff9db 0px,
        #fff9db 4px,
        var(--c-stripe, #ff8fab) 4px,
        var(--c-stripe, #ff8fab) 8px
      );
      box-shadow: inset -1.5px 0 3px rgba(0, 0, 0, 0.18), 0 3px 6px rgba(0, 0, 0, 0.35);
    }

    .mini-candle::before {
      content: "";
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 1.5px;
      height: 5px;
      background: #2b2d42;
      border-radius: 1px;
    }

    .mini-flame {
      width: 10px;
      height: 16px;
      background: radial-gradient(circle at 50% 70%, #ffffff 15%, #ffe066 48%, #ff6b6b 88%);
      border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
      position: absolute;
      top: -19px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 10px #ffe066, 0 0 18px #ff922b;
      transform-origin: 50% 90%;
      animation: miniFlicker var(--f-dur, 0.24s) infinite alternate;
    }

    .mini-flame.blown {
      display: none;
    }

    @keyframes miniFlicker {
      0%   { transform: translateX(-50%) scale(0.92) rotate(-4deg); }
      100% { transform: translateX(-50%) scale(1.14) rotate(4deg); }
    }

    .top-berries {
      position: relative;
      z-index: 3;
      width: 210px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 18px;
      margin-bottom: -6px;
    }

    .berry {
      width: 24px;
      height: 26px;
      background: radial-gradient(circle at 35% 30%, #ff5c8a, #d90429 85%);
      border-radius: 50% 50% 45% 45% / 40% 40% 60% 60%;
      position: relative;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.35);
    }

    .berry::before {
      content: "🌿";
      font-size: 12px;
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
    }

    .berry.center {
      transform: translateY(-4px) scale(1.08);
    }

    .big-tier-top {
      width: 224px;
      height: 74px;
      background: linear-gradient(180deg, #fff0f5 0%, #ffc2d4 45%, #ff8fab 100%);
      border-radius: 22px 22px 8px 8px;
      position: relative;
      z-index: 2;
      box-shadow: inset 0 -6px 14px rgba(190, 24, 93, 0.16), 0 8px 18px rgba(0, 0, 0, 0.35);
    }

    .big-tier-top::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 28px;
      background:
        radial-gradient(circle at 18px 22px, #fff8fa 13px, transparent 14px),
        radial-gradient(circle at 46px 26px, #fff8fa 15px, transparent 16px),
        radial-gradient(circle at 78px 20px, #fff8fa 12px, transparent 13px),
        radial-gradient(circle at 108px 27px, #fff8fa 15px, transparent 16px),
        radial-gradient(circle at 140px 21px, #fff8fa 13px, transparent 14px),
        radial-gradient(circle at 172px 26px, #fff8fa 14px, transparent 15px),
        radial-gradient(circle at 202px 21px, #fff8fa 13px, transparent 14px),
        linear-gradient(#fff8fa, #fff8fa);
      background-size: 100% 100%;
      border-radius: 22px 22px 0 0;
    }

    .sprinkles {
      position: absolute;
      inset: 26px 14px 10px;
      pointer-events: none;
    }

    .sprinkles span {
      position: absolute;
      width: 7px;
      height: 3px;
      border-radius: 999px;
    }

    .big-tier-bottom {
      width: 312px;
      height: 92px;
      background: linear-gradient(180deg, #e0f2fe 0%, #7dd3fc 45%, #38bdf8 100%);
      border-radius: 20px 20px 12px 12px;
      position: relative;
      z-index: 1;
      margin-top: -2px;
      box-shadow: inset 0 -8px 16px rgba(3, 105, 161, 0.2), 0 12px 24px rgba(0, 0, 0, 0.45);
    }

    .big-tier-bottom::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 30px;
      background:
        radial-gradient(circle at 22px 24px, #ffffff 14px, transparent 15px),
        radial-gradient(circle at 58px 28px, #ffffff 16px, transparent 17px),
        radial-gradient(circle at 96px 22px, #ffffff 13px, transparent 14px),
        radial-gradient(circle at 134px 28px, #ffffff 16px, transparent 17px),
        radial-gradient(circle at 174px 23px, #ffffff 14px, transparent 15px),
        radial-gradient(circle at 214px 28px, #ffffff 16px, transparent 17px),
        radial-gradient(circle at 254px 23px, #ffffff 14px, transparent 15px),
        radial-gradient(circle at 288px 25px, #ffffff 13px, transparent 14px),
        linear-gradient(#ffffff, #ffffff);
      border-radius: 20px 20px 0 0;
    }

    .pearl-rim {
      position: absolute;
      bottom: 4px;
      left: 12px;
      right: 12px;
      height: 12px;
      background: radial-gradient(circle at 7px 6px, #fffdf7 5.5px, transparent 6px);
      background-size: 14px 12px;
    }

    .cake-stand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -2px;
    }

    .big-plate {
      width: 364px;
      height: 16px;
      background: linear-gradient(90deg, #cbd5e1, #ffffff, #f8fafc, #ffffff, #cbd5e1);
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55);
    }

    .stand-base {
      width: 148px;
      height: 12px;
      background: linear-gradient(90deg, #94a3b8, #e2e8f0, #94a3b8);
      border-radius: 0 0 18px 18px;
      opacity: 0.9;
    }

    .cake-hint {
      margin-top: clamp(16px, 3.5dvh, 28px);
      font-family: "Quicksand", system-ui, sans-serif;
      font-size: clamp(0.95rem, 3.5vw, 1.38rem);
      font-weight: 700;
      color: #ffd6e0;
      max-width: 90vw;
      line-height: 1.45;

  <script>

    const balloonPalette = [
      { color: "#ff8fab", glow: "rgba(255, 143, 171, 0.4)" },
      { color: "#ffe066", glow: "rgba(255, 224, 102, 0.4)" },
      { color: "#7dd3fc", glow: "rgba(125, 211, 252, 0.4)" },
      { color: "#e879f9", glow: "rgba(232, 121, 249, 0.4)" },

    ];

    const heartPalette = [
      { glyph: "♥", color: "#ff8fab", glow: "rgba(255, 143, 171, 0.65)" },
      { glyph: "♡", color: "#ffd6e0", glow: "rgba(255, 214, 224, 0.6)" },
      { glyph: "♥", color: "#ffc6ff", glow: "rgba(255, 198, 255, 0.65)" },

    ];

    const introStage = document.getElementById("introStage");

    const introLine = document.getElementById("introLine");
    const revealBtn = document.getElementById("revealBtn");
    const hbdFlashStage = document.getElementById("hbdFlashStage");
    const ageFlashStage = document.getElementById("ageFlashStage");
    const heartLayer = document.getElementById("heartLayer");
    const balloonLayer = document.getElementById("balloonLayer");
    const cakeStage = document.getElementById("cakeStage");
    const candlesRow = document.getElementById("candlesRow");
    const teaseStage = document.getElementById("teaseStage");
    const cakeHint = document.getElementById("cakeHint");
    const mainContent = document.getElementById("mainContent");
    const line1El = document.getElementById("line1");
    const line2El = document.getElementById("line2");
    const line3El = document.getElementById("line3");
    const baiBaiStage = document.getElementById("baiBaiStage");
    const replayStage = document.getElementById("replayStage");

    let runToken = 0;
    let fireworksActive = false;
    let fireworksTimer = null;
    let balloonTimer = null;
    let byeBalloonTimer = null;
    let candleBlown = false;
    const activeTimeouts = new Set();

    function spawnHeart() {
      const h = document.createElement("div");
      const theme = heartPalette[Math.floor(Math.random() * heartPalette.length)];
      const size = Math.floor(Math.random() * 10) + 14;
      const left = Math.random() * 92 + 4;
      const durNum = Number((Math.random() * 2.2 + 4.4).toFixed(1));
      const sway = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 18) + 8) + "px";

      h.className = "floating-heart";
      h.textContent = theme.glyph;
      h.style.setProperty("--h-size", size + "px");
      h.style.setProperty("--h-color", theme.color);
      h.style.setProperty("--h-glow", theme.glow);
      h.style.setProperty("--h-dur", durNum + "s");
      h.style.setProperty("--h-sway", sway);
      h.style.left = left + "%";

      heartLayer.appendChild(h);
      setTimeout(() => h.remove(), (durNum + 0.3) * 1000);
    }

    spawnHeart();
    setInterval(spawnHeart, 520);

    function buildSeventeenCandles() {
      candlesRow.innerHTML = "";
      const total = 17;
      const stripes = ["#ff8fab", "#7dd3fc", "#ffe066", "#c084fc", "#6ee7b7"];

      for (let i = 0; i < total; i++) {
        const candle = document.createElement("div");
        candle.className = "mini-candle";

        const norm = (i - (total - 1) / 2) / ((total - 1) / 2);
        const yOff = Math.round((norm * norm) * 6);
        const h = 32 + ((i * 7) % 10);
        const stripe = stripes[i % stripes.length];
        const fDur = (0.2 + (i % 5) * 0.035).toFixed(3) + "s";

        candle.style.setProperty("--h", h + "px");
        candle.style.setProperty("--y-off", yOff + "px");
        candle.style.setProperty("--c-stripe", stripe);

        const flame = document.createElement("div");
        flame.className = "mini-flame";
        flame.style.setProperty("--f-dur", fDur);

        candle.appendChild(flame);
        candlesRow.appendChild(candle);
      }
    }

    buildSeventeenCandles();

    function trackTimeout(fn, ms) {
      const id = setTimeout(() => {
        activeTimeouts.delete(id);
        fn();
      }, ms);
      activeTimeouts.add(id);
      return id;
    }

    function clearAllTrackedTimeouts() {
      activeTimeouts.forEach(id => clearTimeout(id));
      activeTimeouts.clear();
    }

    function wait(ms, token = runToken) {
      return new Promise((resolve, reject) => {
        trackTimeout(() => {
          if (token !== runToken) reject(new Error("cancelled"));
          else resolve();
        }, ms);
      });
    }

    function playBalloonPopSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        const now = audioCtx.currentTime;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        const baseFreq = 155 + Math.random() * 65;
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(48, now + 0.11);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.32, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      } catch (_) {}
    }

    function spawnPopBurst(x, y, color) {
      for (let i = 0; i < 8; i++) {
        const dot = document.createElement("span");
        const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.3;
        const dist = 22 + Math.random() * 18;
        dot.className = "pop-burst";
        dot.style.left = x + "px";
        dot.style.top = y + "px";
        dot.style.setProperty("--pop-color", color);
        dot.style.setProperty("--px", Math.cos(angle) * dist + "px");
        dot.style.setProperty("--py", Math.sin(angle) * dist + "px");
        document.body.appendChild(dot);
        setTimeout(() => dot.remove(), 600);
      }
    }

    function popBalloonElement(b, color) {
      if (!b || !b.isConnected || b.dataset.popped === "1") return;
      b.dataset.popped = "1";
      const rect = b.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      playBalloonPopSound();
      spawnPopBurst(cx, cy, color);
      b.remove();
    }

    function spawnByeBalloonWithPop(token = runToken) {
      const b = document.createElement("div");
      const theme = balloonPalette[Math.floor(Math.random() * balloonPalette.length)];
      const baseSize = window.innerWidth < 500 ? 42 : 50;
      const size = Math.floor(Math.random() * 16) + baseSize;
      const left = Math.random() * 82 + 8;
      const durNum = Number((Math.random() * 1.1 + 3.4).toFixed(1));
      const sway = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 18) + 10) + "px";

      b.className = "balloon poppable";
      b.style.setProperty("--size", size + "px");
      b.style.setProperty("--color", theme.color);
      b.style.setProperty("--glow", theme.glow);
      b.style.setProperty("--dur", durNum + "s");
      b.style.setProperty("--sway", sway);
      b.style.left = left + "%";

      b.addEventListener("pointerdown", e => {
        e.stopPropagation();
        popBalloonElement(b, theme.color);
      });

      balloonLayer.appendChild(b);

      const popDelay = (durNum * (0.42 + Math.random() * 0.35)) * 1000;
      trackTimeout(() => {
        if (token === runToken) popBalloonElement(b, theme.color);
      }, popDelay);

      trackTimeout(() => b.remove(), (durNum + 0.5) * 1000);
    }

    function runBalloonsAndWaitFinish(count = 10, intervalMs = 180, token = runToken) {
      stopBalloonBurst();
      balloonLayer.classList.remove("interactive-pop");
      return new Promise((resolve, reject) => {
        let spawned = 0;
        let maxFinishTime = 0;

        function createOne() {
          if (token !== runToken) {
            stopBalloonBurst();
            reject(new Error("cancelled"));
            return;
          }
          const theme = balloonPalette[Math.floor(Math.random() * balloonPalette.length)];
          const baseSize = window.innerWidth < 500 ? 38 : 46;
          const size = Math.floor(Math.random() * 18) + baseSize;
          const left = Math.random() * 84 + 6;
          const durNum = Number((Math.random() * 1.2 + 3.8).toFixed(1));
          const sway = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 18) + 10) + "px";

          const b = document.createElement("div");
          b.className = "balloon";
          b.style.setProperty("--size", size + "px");
          b.style.setProperty("--color", theme.color);
          b.style.setProperty("--glow", theme.glow);
          b.style.setProperty("--dur", durNum + "s");
          b.style.setProperty("--sway", sway);
          b.style.left = left + "%";

          balloonLayer.appendChild(b);
          trackTimeout(() => b.remove(), (durNum + 0.4) * 1000);

          const elapsed = spawned * intervalMs;
          maxFinishTime = Math.max(maxFinishTime, elapsed + durNum * 1000);
          spawned++;

          if (spawned >= count) {
            stopBalloonBurst();
            const waitLeft = Math.max(0, maxFinishTime - elapsed);
            trackTimeout(() => {
              if (token !== runToken) reject(new Error("cancelled"));
              else resolve();
            }, waitLeft);
          }
        }

        createOne();
        balloonTimer = setInterval(createOne, intervalMs);
      });
    }

    function stopBalloonBurst() {
      if (balloonTimer) {
        clearInterval(balloonTimer);
        balloonTimer = null;
      }
      if (byeBalloonTimer) {
        clearInterval(byeBalloonTimer);
        byeBalloonTimer = null;
      }
      balloonLayer.classList.remove("interactive-pop");
    }

    async function revealWishWordByWord(text, token) {
      line2El.innerHTML = "";
      const tokens = text.split(/(\s+)/);
      const wordSpans = [];

      tokens.forEach(tokenPart => {
        if (!tokenPart) return;
        if (/^\s+$/.test(tokenPart)) {
          line2El.appendChild(document.createTextNode(" "));
        } else {
          const span = document.createElement("span");
          span.className = "wish-word";
          span.textContent = tokenPart;
          line2El.appendChild(span);
          wordSpans.push(span);
        }
      });

      for (const span of wordSpans) {
        if (token !== runToken) throw new Error("cancelled");
        span.classList.add("show");
        await wait(115, token);
      }
    }

    async function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        await audioCtx.resume().catch(() => {});
      }
    }

    async function beginIntroFromButton() {
      const token = runToken;
      startBtn.style.pointerEvents = "none";
      await unlockAudio();
      if (token !== runToken) return;

      try {
        startBtn.classList.remove("show");
        await wait(450, token);
        startBtn.style.display = "none";

        introLine.style.display = "block";
        await wait(120, token);

        for (const text of introLines) {
          introLine.textContent = text;
          introLine.classList.add("show");
          await wait(2900, token);
          introLine.classList.remove("show");
          await wait(1150, token);
        }

        introLine.style.display = "none";
        revealBtn.style.display = "inline-block";
        await wait(100, token);
        revealBtn.classList.add("show");
      } catch (_) {}
    }

    function blowOutCandle() {
      if (candleBlown) return;
      candleBlown = true;
      document.querySelectorAll(".mini-flame").forEach(f => f.classList.add("blown"));
      cakeHint.textContent = "phùuu~ 17 ngọn nến tắt rồi, điều ước bay đi rồi ✨";
      boom(W * 0.35, H * 0.35);
      boom(W * 0.65, H * 0.35);
    }

    async function startBirthdayFinale() {
      const token = runToken;
      revealBtn.style.pointerEvents = "none";
      await unlockAudio();
      if (token !== runToken) return;

      try {
        introStage.style.opacity = "0";
        await wait(800, token);
        introStage.style.display = "none";

        hbdFlashStage.style.display = "flex";
        hbdFlashStage.style.opacity = "1";
        hbdFlashStage.classList.add("active");
        startMusic();
        await runBalloonsAndWaitFinish(10, 180, token);

        hbdFlashStage.style.opacity = "0";
        await wait(850, token);
        hbdFlashStage.classList.remove("active");
        hbdFlashStage.style.display = "none";

        ageFlashStage.style.display = "flex";
        ageFlashStage.style.opacity = "1";
        ageFlashStage.classList.add("active");
        startAutoFireworks();
        await wait(3400, token);

        ageFlashStage.style.opacity = "0";
        await wait(850, token);
        ageFlashStage.classList.remove("active");
        ageFlashStage.style.display = "none";

        cakeStage.style.display = "flex";
        cakeStage.style.opacity = "1";
        cakeStage.classList.add("active");
        await wait(15000, token);

        cakeStage.style.opacity = "0";
        await wait(850, token);
        cakeStage.classList.remove("active");
        cakeStage.style.display = "none";

        teaseStage.style.display = "flex";
        teaseStage.style.opacity = "1";
        teaseStage.classList.add("active");
        await wait(3500, token);

        teaseStage.style.opacity = "0";
        await wait(850, token);
        teaseStage.classList.remove("active");
        teaseStage.style.display = "none";

        mainContent.style.display = "block";
        mainContent.classList.remove("fade-out");
        mainContent.classList.add("visible");
        startAutoFireworks();

        await wait(300, token);
        line1El.classList.add("show");
        await wait(900, token);
        await revealWishWordByWord(finalWishText, token);
        await wait(700, token);
        line3El.classList.add("show");

        await wait(20000, token);

        mainContent.classList.add("fade-out");
        await wait(950, token);
        mainContent.classList.remove("visible");
        mainContent.style.display = "none";

        baiBaiStage.style.display = "flex";
        baiBaiStage.style.opacity = "1";
        baiBaiStage.classList.add("active");
        balloonLayer.classList.add("interactive-pop");
        spawnByeBalloonWithPop(token);
        byeBalloonTimer = setInterval(() => {
          if (token === runToken) spawnByeBalloonWithPop(token);
        }, 420);
        await wait(10000, token);
        stopBalloonBurst();

        replayStage.style.display = "flex";
        replayStage.style.opacity = "1";
        replayStage.classList.add("active");
      } catch (_) {}
    }

    function restartExperience() {
      runToken++;
      clearAllTrackedTimeouts();
      stopBalloonBurst();
      stopMusic();

      fireworksActive = false;
      if (fireworksTimer) {
        clearInterval(fireworksTimer);
        fireworksTimer = null;
      }

      candleBlown = false;
      balloonLayer.innerHTML = "";
      heartLayer.innerHTML = "";
      sparks = [];
      shooting = [];
      buildSeventeenCandles();

      replayStage.classList.remove("active");
      replayStage.style.opacity = "0";
      replayStage.style.display = "none";

      baiBaiStage.classList.remove("active");
      baiBaiStage.style.opacity = "0";
      baiBaiStage.style.display = "none";

      mainContent.classList.remove("visible", "fade-out");
      mainContent.style.display = "none";
      mainContent.scrollTop = 0;
      line1El.classList.remove("show");
      line2El.innerHTML = "";
      line3El.classList.remove("show");

      teaseStage.classList.remove("active");
      teaseStage.style.opacity = "0";
      teaseStage.style.display = "none";

      cakeStage.classList.remove("active");
      cakeStage.style.opacity = "0";
      cakeStage.style.display = "none";
      cakeHint.textContent = "ước xong thì hãy thổi nến để ước nguyện được ông trời nghe thấy";

      ageFlashStage.classList.remove("active");
      ageFlashStage.style.opacity = "0";
      ageFlashStage.style.display = "none";

      hbdFlashStage.classList.remove("active");
      hbdFlashStage.style.opacity = "0";
      hbdFlashStage.style.display = "none";

      introLine.textContent = "";
      introLine.classList.remove("show");
      introLine.style.display = "none";

      revealBtn.classList.remove("show");
      revealBtn.style.display = "none";
      revealBtn.style.pointerEvents = "auto";

      introStage.style.display = "flex";
      introStage.style.opacity = "1";

      startBtn.style.display = "inline-block";
      startBtn.style.pointerEvents = "auto";
      startBtn.classList.remove("show");
      requestAnimationFrame(() => {
        startBtn.classList.add("show");
      });
    }

    const spaceCanvas = document.getElementById("space");
    const ctx = spaceCanvas.getContext("2d");
    let W, H;

    function updateResponsiveScale() {
      W = spaceCanvas.width = window.innerWidth;
      H = spaceCanvas.height = window.innerHeight;

      const widthScale = (W * 0.88) / 364;
      const heightScale = (H * 0.48) / 300;
      const cakeScale = Math.max(0.55, Math.min(1.08, widthScale, heightScale));
      document.documentElement.style.setProperty("--cake-scale", cakeScale.toFixed(3));
    }

    window.addEventListener("resize", updateResponsiveScale);
    window.addEventListener("orientationchange", () => setTimeout(updateResponsiveScale, 150));
    updateResponsiveScale();

    const nebulae = [
      { x: 0.22, y: 0.28, r: 280, color: "rgba(255, 130, 180, 0.055)", dx: 0.00018, dy: 0.00012, phase: 0 },
      { x: 0.78, y: 0.34, r: 320, color: "rgba(120, 200, 255, 0.055)", dx: -0.00015, dy: 0.00016, phase: 1.7 },
      { x: 0.52, y: 0.74, r: 300, color: "rgba(255, 215, 130, 0.05)",  dx: 0.00012, dy: -0.00014, phase: 3.2 },
      { x: 0.65, y: 0.65, r: 240, color: "rgba(210, 140, 255, 0.045)", dx: -0.00014, dy: -0.0001, phase: 4.8 }
    ];

    const stars = Array.from({ length: 260 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.9 + 0.35,
      driftX: (Math.random() - 0.5) * 0.14,
      driftY: (Math.random() - 0.5) * 0.14,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.025 + 0.006,
      tint: ["#ffffff", "#fff3d6", "#dbeafe", "#fce7f3"][Math.floor(Math.random() * 4)]
    }));

    const dust = Array.from({ length: 95 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 0.9 + 0.25,
      vx: (Math.random() - 0.5) * 0.24,
      vy: -Math.random() * 0.18 - 0.04,
      alpha: Math.random() * 0.35 + 0.12
    }));

    let shooting = [];
    setInterval(() => {
      if (!fireworksActive) return;
      shooting.push({
        x: Math.random() * W * 0.8,
        y: Math.random() * H * 0.4,
        len: Math.random() * 85 + 55,
        vx: 10.5,
        vy: 5.2,
        alpha: 1
      });
    }, 2400);

    let sparks = [];
    function boom(x, y) {
      const colors = ["#ff6b6b", "#feca57", "#48dbfb", "#ff9ff3", "#1dd1a1", "#ffffff"];
      for (let i = 0; i < 72; i++) {
        const angle = (Math.PI * 2 * i) / 72;
        const speed = Math.random() * 5.8 + 1.6;
        sparks.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          size: Math.random() * 2.9 + 1
        });
      }
    }

    function startAutoFireworks() {
      fireworksActive = true;
      if (fireworksTimer) clearInterval(fireworksTimer);

      boom(W * 0.25, H * 0.32);
      trackTimeout(() => { if (fireworksActive) boom(W * 0.75, H * 0.32); }, 280);
      trackTimeout(() => { if (fireworksActive) boom(W * 0.5, H * 0.22); }, 560);

      fireworksTimer = setInterval(() => {
        if (!fireworksActive) return;
        const fx = W * (0.16 + Math.random() * 0.68);
        const fy = H * (0.16 + Math.random() * 0.42);
        boom(fx, fy);
      }, 750);
    }

    function render() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, W, H);

      nebulae.forEach(nb => {
        nb.phase += 0.008;
        nb.x += nb.dx;
        nb.y += nb.dy;
        if (nb.x < 0.1 || nb.x > 0.9) nb.dx *= -1;
        if (nb.y < 0.15 || nb.y > 0.85) nb.dy *= -1;

        const cx = nb.x * W + Math.cos(nb.phase) * 18;
        const cy = nb.y * H + Math.sin(nb.phase) * 14;
        const radius = nb.r * (Math.min(W, H) / 760);

        const grad = ctx.createRadialGradient(cx, cy, radius * 0.05, cx, cy, radius);
        grad.addColorStop(0, nb.color);
        grad.addColorStop(1, "rgba(0, 0, 0, 0)");

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
      });

      dust.forEach(d => {
        d.x += d.vx;
        d.y += d.vy;
        if (d.x < 0) d.x = W;
        if (d.x > W) d.x = 0;
        if (d.y < 0) d.y = H;
        if (d.y > H) d.y = 0;

        ctx.fillStyle = `rgba(255, 255, 255, ${d.alpha})`;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
      });

      stars.forEach(s => {
        s.phase += s.speed;
        s.x += s.driftX;
        s.y += s.driftY;
        if (s.x < 0) s.x = W;
        if (s.x > W) s.x = 0;
        if (s.y < 0) s.y = H;
        if (s.y > H) s.y = 0;

        const a = 0.22 + Math.abs(Math.sin(s.phase)) * 0.78;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = s.tint;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      shooting.forEach((ss, i) => {
        ctx.strokeStyle = `rgba(255, 255, 255, ${ss.alpha})`;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(ss.x, ss.y);
        ctx.lineTo(ss.x - ss.len, ss.y - ss.len * 0.5);
        ctx.stroke();
        ss.x += ss.vx;
        ss.y += ss.vy;
        ss.alpha -= 0.02;
        if (ss.alpha <= 0) shooting.splice(i, 1);
      });

      sparks.forEach((p, i) => {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.alpha -= 0.015;
        if (p.alpha <= 0) sparks.splice(i, 1);
      });
      ctx.globalAlpha = 1;

      requestAnimationFrame(render);
    }
    render();

    // --- GIAI ĐIỆU HAPPY BIRTHDAY TỰ PHÁT ---
    let audioCtx = null;
    let playing = false;
    let loopId = null;
    let activeOscillators = [];

    const melody = [
      [261.63, 0.35], [261.63, 0.25], [293.66, 0.6], [261.63, 0.6], [349.23, 0.6], [329.63, 1.1],
      [261.63, 0.35], [261.63, 0.25], [293.66, 0.6], [261.63, 0.6], [392.00, 0.6], [349.23, 1.1],
      [261.63, 0.35], [261.63, 0.25], [523.25, 0.6], [440.00, 0.6], [349.23, 0.6], [329.63, 0.6], [293.66, 1.0],
      [466.16, 0.35], [466.16, 0.25], [440.00, 0.6], [349.23, 0.6], [392.00, 0.6], [349.23, 1.2]
    ];

    function playLoop() {
      if (!playing) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      let t = audioCtx.currentTime;

      melody.forEach(([freq, dur]) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.exponentialRampToValueAtTime(0.24, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur - 0.02);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur);
        activeOscillators.push(osc);
        t += dur;
      });

      const totalMs = melody.reduce((sum, n) => sum + n[1], 0) * 1000 + 600;
      loopId = setTimeout(playLoop, totalMs);
    }

    function startMusic() {
      if (playing) return;
      playing = true;
      playLoop();
    }

    function stopMusic() {
      playing = false;
      if (loopId) {
        clearTimeout(loopId);
        loopId = null;
      }
      activeOscillators.forEach(osc => {
        try { osc.stop(); } catch (_) {}
      });
      activeOscillators = [];
    }
  </script>
