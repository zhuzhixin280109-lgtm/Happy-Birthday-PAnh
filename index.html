<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dành cho cậu — Một góc bình yên ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Hiệu ứng thẻ kính 3D */
    .card-wrapper {
      perspective: 1000px;
      z-index: 10;
      padding: 20px;
      width: 100%;
      max-width: 420px;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 40px 28px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.05);
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
      position: relative;
      overflow: hidden;
    }

    /* Ánh sáng lướt qua thẻ */
    .glass-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 223, 186, 0.12) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .glass-card:hover::before { opacity: 1; }

    /* Quả cầu năng lượng phát sáng */
    .orb-container {
      position: relative;
      width: 84px;
      height: 84px;
      margin: 0 auto 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: translateZ(30px);
    }

    .orb {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff6e5, #ffb75e, #ed8f03);
      box-shadow: 0 0 25px #ffb75e, 0 0 50px rgba(255, 183, 94, 0.6);
      animation: breathe 4s ease-in-out infinite;
      cursor: pointer;
    }

    .orb-ring {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255, 215, 150, 0.5);
      animation: spin 12s linear infinite;
      pointer-events: none;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.95); box-shadow: 0 0 20px #ffb75e, 0 0 40px rgba(255, 183, 94, 0.4); }
      50% { transform: scale(1.1); box-shadow: 0 0 35px #ffd280, 0 0 70px rgba(255, 183, 94, 0.85); }
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffe8c8;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
      transform: translateZ(20px);
    }

    .msg-box {
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 26px;
      padding: 0 6px;
      transform: translateZ(25px);
    }

    #typewriter {
      font-size: 16px;
      line-height: 1.65;
      color: #e2e8f0;
      font-weight: 400;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 17px;
      background-color: #ffb75e;
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .btn-glow {
      background: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%);
      border: none;
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 30px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 94, 98, 0.45);
      transition: all 0.2s ease;
      transform: translateZ(30px);
      position: relative;
      overflow: hidden;
    }

    .btn-glow:hover {
      transform: translateZ(35px) scale(1.04);
      box-shadow: 0 12px 30px rgba(255, 94, 98, 0.7);
    }

    .btn-glow:active {
      transform: translateZ(25px) scale(0.96);
    }

    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <canvas id="universe"></canvas>

  <div class="card-wrapper" id="wrapper">
    <div class="glass-card" id="card">
      <div class="orb-container" onclick="triggerMagic(event)">
        <div class="orb-ring"></div>
        <div class="orb"></div>
      </div>
      <h1>Tạm dừng một chút nhé...</h1>
      <div class="msg-box">
        <p id="typewriter">Bầu trời tối nhất là lúc những vì sao sáng rõ nhất. Chạm vào nút bên dưới để nhận một tia sáng nhỏ nhé ✨</p>
      </div>
      <button class="btn-glow" onclick="triggerMagic(event)">Thắp sáng năng lượng ✨</button>
      <div class="hint">Chạm hoặc di chuyển trên nền trời để kết nối các vì sao</div>
    </div>
  </div>

  <script>
    // 1. HỆ THỐNG LỜI NHẮN & HIỆU ỨNG GÕ CHỮ (TYPEWRITER)
    const quotes = [
      "Cậu không cần phải tỏa sáng rực rỡ ngay lúc này. Chỉ cần giữ ngọn lửa nhỏ trong tim không tắt là đã giỏi lắm rồi.",
      "Mọi áp lực hôm nay rồi sẽ hóa thành bệ phóng cho cậu ngày mai. Hít một hơi thật sâu, thả lỏng vai ra nào!",
      "Đừng so sánh chặng đường của mình với bất kỳ ai. Mỗi bông hoa đều có một mùa nở rộ riêng, và cậu cũng thế.",
      "Nếu hôm nay quá mệt, hãy cho phép bản thân được nghỉ ngơi. Cả thế giới ngoài kia có thể đợi cậu nạp đầy pin.",
      "Cậu đã vượt qua 100% những ngày tồi tệ nhất trong quá khứ rồi. Lần này cũng chắc chắn sẽ qua thôi!",
      "Chỉ cần bước thêm một bước nhỏ xíu nữa thôi. Tớ luôn ở đây, âm thầm cổ vũ và tự hào về cậu rất nhiều 💛",
      "Bầu trời có lúc giông bão, nhưng chưa bao giờ mưa mãi. Sau cơn mưa, cầu vồng đẹp nhất đang đợi cậu phía trước."
    ];

    let lastQuoteIdx = -1;
    let typingTimer = null;

    function typeMessage(text) {
      clearInterval(typingTimer);
      const el = document.getElementById('typewriter');
      el.innerHTML = '<span class="cursor"></span>';
      let i = 0;
      typingTimer = setInterval(() => {
        if (i < text.length) {
          el.innerHTML = text.slice(0, i + 1) + '<span class="cursor"></span>';
          i++;
        } else {
          clearInterval(typingTimer);
          setTimeout(() => { el.innerHTML = text; }, 1200);
        }
      }, 28);
    }

    // 2. TỔNG HỢP ÂM THANH CHUÔNG GIÓ CHỮA LÀNH (WEB AUDIO API)
    let audioCtx = null;
    function playChime() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        // Thang âm ngũ cung (Pentatonic) luôn tạo cảm giác thư giãn, dễ chịu
        const notes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
        const freq = notes[Math.floor(Math.random() * notes.length)];

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.8);
      } catch (e) {}
    }

    // 3. HIỆU ỨNG THẺ NGHIÊNG 3D THEO CHUỘT / CHẠM
    const card = document.getElementById('card');
    document.addEventListener('mousemove', (e) => {
      const xAxis = (window.innerWidth / 2 - e.pageX) / 28;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 28;
      card.style.transform = `rotateY(${-xAxis}deg) rotateX(${yAxis}deg)`;
    });
    document.addEventListener('mouseleave', () => {
      card.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });

    // 4. VŨ TRỤ HẠT SÁNG, CHÒM SAO TƯƠNG TÁC & SAO BĂNG (CANVAS)
    const canvas = document.getElementById('universe');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const pointer = { x: null, y: null };
    window.addEventListener('mousemove', e => { pointer.x = e.clientX; pointer.y = e.clientY; });
    window.addEventListener('touchmove', e => {
      if (e.touches.length > 0) {
        pointer.x = e.touches[0].clientX;
        pointer.y = e.touches[0].clientY;
      }
    });
    window.addEventListener('touchend', () => { pointer.x = null; pointer.y = null; });

    // Các ngôi sao nền
    const stars = Array.from({ length: 85 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      radius: Math.random() * 1.8 + 0.6,
      alpha: Math.random()
    }));

    // Sao băng
    let shootingStars = [];
    function spawnShootingStar() {
      shootingStars.push({
        x: Math.random() * width * 0.8,
        y: Math.random() * height * 0.3,
        len: Math.random() * 90 + 60,
        speed: Math.random() * 10 + 12,
        alpha: 1
      });
    }
    setInterval(() => { if (Math.random() > 0.3) spawnShootingStar(); }, 3200);

    // Hạt pháo hoa năng lượng khi bấm nút
    let sparks = [];
    function createExplosion(x, y) {
      const colors = ['#ffd280', '#ff9966', '#ffffff', '#ff758c', '#ffeaa7'];
      for (let i = 0; i < 45; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 1.5;
        sparks.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3 + 1.5,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1,
          decay: Math.random() * 0.02 + 0.015
        });
      }
    }

    function triggerMagic(e) {
      let idx;
      do {
        idx = Math.floor(Math.random() * quotes.length);
      } while (idx === lastQuoteIdx);
      lastQuoteIdx = idx;

      typeMessage(quotes[idx]);
      playChime();
      spawnShootingStar();

      const x = (e && e.clientX) ? e.clientX : width / 2;
      const y = (e && e.clientY) ? e.clientY : height / 2;
      createExplosion(x, y);
    }

    // Vòng lặp vẽ 60fps
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Vẽ sao nền & nối dây chòm sao khi lại gần chuột/tay
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.x += s.vx;
        s.y += s.vy;
        if (s.x < 0 || s.x > width) s.vx *= -1;
        if (s.y < 0 || s.y > height) s.vy *= -1;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 240, 210, ${0.4 + Math.sin(Date.now() * 0.003 + i) * 0.3})`;
        ctx.fill();

        if (pointer.x !== null) {
          const dx = s.x - pointer.x;
          const dy = s.y - pointer.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 130) {
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(pointer.x, pointer.y);
            ctx.strokeStyle = `rgba(255, 210, 140, ${1 - dist / 130})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }

      // Vẽ sao băng
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const ss = shootingStars[i];
        ss.x += ss.speed;
        ss.y += ss.speed * 0.55;
        ss.alpha -= 0.018;

        const grad = ctx.createLinearGradient(ss.x, ss.y, ss.x - ss.len, ss.y - ss.len * 0.55);
        grad.addColorStop(0, `rgba(255, 245, 220, ${ss.alpha})`);
        grad.addColorStop(1, 'rgba(255, 245, 220, 0)');

        ctx.beginPath();
        ctx.moveTo(ss.x, ss.y);
        ctx.lineTo(ss.x - ss.len, ss.y - ss.len * 0.55);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.stroke();

        if (ss.alpha <= 0) shootingStars.splice(i, 1);
      }

      // Vẽ hạt pháo hoa bung tỏa
      for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04; // Trọng lực nhẹ
        p.life -= p.decay;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fill();
        ctx.globalAlpha = 1;

        if (p.life <= 0) sparks.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
