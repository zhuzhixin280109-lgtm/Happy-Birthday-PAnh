<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trạm Tinh Vân Chữa Lành ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle at 50% 40%, #1a103c 0%, #090617 55%, #030208 100%);
      height: 100vh;
      overflow: hidden;
      color: #fff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Nút bật tắt nhạc nền du dương */
    .music-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: #ffd8a8;
      padding: 8px 14px;
      border-radius: 30px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }
    .music-toggle:hover { background: rgba(255, 255, 255, 0.16); }

    /* Giao diện nổi phía dưới để không che mất khối hạt 3D ở giữa */
    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 28px 18px 32px;
      pointer-events: none;
    }

    .header-tag {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 218, 179, 0.75);
      text-shadow: 0 0 12px rgba(255, 183, 94, 0.5);
      margin-top: 8px;
    }

    .bottom-panel {
      width: 100%;
      max-width: 440px;
      background: rgba(18, 14, 38, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 24px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 25px rgba(255, 190, 130, 0.06);
      pointer-events: auto;
      transition: transform 0.3s ease;
    }

    .quote-area {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    #quoteText {
      font-size: 16px;
      line-height: 1.6;
      color: #f8fafc;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* Khu vực nhập muộn phiền để tan biến */
    .worry-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .worry-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: 13.5px;
      padding: 6px 12px;
    }
    .worry-box input::placeholder { color: rgba(255, 255, 255, 0.4); }

    .worry-btn {
      background: rgba(255, 255, 255, 0.14);
      border: none;
      color: #ffd8a8;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .worry-btn:hover { background: rgba(255, 255, 255, 0.25); }

    /* Hàng nút điều khiển chính */
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-primary {
      flex: 2;
      background: linear-gradient(135deg, #ff9a76 0%, #ff5e7e 100%);
      border: none;
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 14.5px;
      padding: 13px 18px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 94, 126, 0.45);
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn-primary:active { transform: scale(0.95); }

    .btn-shape {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e2e8f0;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      padding: 13px 10px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-shape:hover { background: rgba(255, 255, 255, 0.16); }

    /* Hiệu ứng chữ bay tan biến */
    .dissolving-word {
      position: fixed;
      pointer-events: none;
      color: #ffd8a8;
      font-weight: 700;
      font-size: 16px;
      z-index: 30;
      text-shadow: 0 0 12px #ff9a76;
      animation: floatAndFade 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatAndFade {
      0% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
      100% { opacity: 0; transform: translateY(-140px) scale(1.3); filter: blur(8px); }
    }
  </style>
</head>
<body>

  <canvas id="galaxyCanvas"></canvas>

  <button class="music-toggle" id="musicBtn" onclick="toggleAmbientMusic()">
    <span id="musicIcon">🔇</span> <span id="musicLabel">Nhạc chữa lành</span>
  </button>

  <div class="ui-layer">
    <div class="header-tag">✦ Dành riêng cho cậu ✦</div>

    <div class="bottom-panel">
      <div class="quote-area">
        <p id="quoteText">Gửi cậu cả một bầu trời sao nhỏ. Khi nào thấy mệt quá, cứ ghé vào đây một chút nhé ✨</p>
      </div>

      <div class="worry-box">
        <input type="text" id="worryInput" placeholder="Gõ điều làm cậu mệt vào đây..." maxlength="60" onkeydown="if(event.key==='Enter') releaseWorry()">
        <button class="worry-btn" onclick="releaseWorry()">Thả trôi 🍃</button>
      </div>

      <div class="actions">
        <button class="btn-primary" onclick="boostEnergy()">Nhận năng lượng ✨</button>
        <button class="btn-shape" onclick="switchShape()">Đổi hình 🪐</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. DANH SÁCH LỜI ĐỘNG VIÊN SÂU SẮC
    // ==========================================
    const messages = [
      "Cậu không cần phải gồng mình gánh hết cả thế giới đâu. Mệt thì nghỉ một nhịp, hít sâu rồi mình đi tiếp nhé.",
      "Có những ngày chỉ cần cậu thức dậy, cố gắng bước qua ngày hôm đó đã là một chiến thắng rực rỡ rồi.",
      "Đừng trách bản thân vì những lúc chững lại. Ngay cả những vì sao cũng cần bóng tối để có thể tỏa sáng.",
      "Mọi nút thắt rồi sẽ từ từ được gỡ bỏ. Tớ luôn tin vào sự kiên cường âm thầm bên trong cậu 💛",
      "Nếu hôm nay năng lượng chỉ còn 10%, cứ dùng 10% đó để yêu thương và chăm sóc chính mình thôi nhé!",
      "Cậu đã đi được một quãng đường rất dài rồi. Hãy tự ôm lấy bản thân một cái thật chặt vì đã không bỏ cuộc.",
      "Bão giông nào rồi cũng sẽ tan, để lại bầu trời trong xanh nhất dành riêng cho sự nỗ lực của cậu."
    ];
    let msgIndex = -1;

    function showNextQuote(customText = null) {
      const el = document.getElementById('quoteText');
      el.style.opacity = 0;
      el.style.transform = 'translateY(8px)';

      setTimeout(() => {
        if (customText) {
          el.innerText = customText;
        } else {
          let next;
          do { next = Math.floor(Math.random() * messages.length); } while (next === msgIndex);
          msgIndex = next;
          el.innerText = messages[next];
        }
        el.style.opacity = 1;
        el.style.transform = 'translateY(0)';
      }, 300);
    }

    // ==========================================
    // 2. HỆ THỐNG ĐỒ HỌA HẠT 3D BIẾN HÌNH (CANVAS)
    // ==========================================
    const canvas = document.getElementById('galaxyCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const PARTICLE_COUNT = 340;
    const particles = [];
    let currentShape = 0; // 0: Trái tim 3D, 1: Quả cầu tinh vân, 2: Dải ngân hà xoắn ốc
    let shockwaves = [];
    let fireflies = [];

    // Khởi tạo các hạt 3D
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: (Math.random() - 0.5) * 400,
        y: (Math.random() - 0.5) * 400,
        z: (Math.random() - 0.5) * 400,
        tx: 0, ty: 0, tz: 0,
        size: Math.random() * 2.2 + 1,
        hue: Math.random() * 50 + 15 // Tông vàng cam - hồng ấm
      });
    }

    // Tính toán tọa độ đích cho 3 hình dạng 3D
    function setTargetShape(shapeType) {
      const scale = Math.min(W, H) * 0.26;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particles[i];
        if (shapeType === 0) {
          // Hình Trái Tim 3D
          const t = (i / PARTICLE_COUNT) * Math.PI * 2;
          const layer = (Math.random() - 0.5) * 0.35;
          const hx = 16 * Math.pow(Math.sin(t), 3);
          const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
          p.tx = (hx / 16) * scale * (1 - Math.abs(layer) * 0.3);
          p.ty = (hy / 16) * scale * (1 - Math.abs(layer) * 0.3) - 20;
          p.tz = layer * scale * 1.4;
          p.hue = 335 + Math.random() * 45; // Hồng đào - vàng ấm
        } else if (shapeType === 1) {
          // Quả cầu tinh vân Fibonacci
          const phi = Math.acos(1 - 2 * (i + 0.5) / PARTICLE_COUNT);
          const theta = Math.PI * (1 + Math.sqrt(5)) * i;
          const r = scale * 0.95;
          p.tx = r * Math.sin(phi) * Math.cos(theta);
          p.ty = r * Math.sin(phi) * Math.sin(theta) - 20;
          p.tz = r * Math.cos(phi);
          p.hue = 30 + Math.random() * 40; // Vàng hổ phách
        } else {
          // Dải ngân hà xoắn ốc
          const angle = i * 0.18;
          const radius = (i / PARTICLE_COUNT) * scale * 1.35;
          p.tx = Math.cos(angle) * radius;
          p.ty = (Math.random() - 0.5) * 35 - 20;
          p.tz = Math.sin(angle) * radius;
          p.hue = 190 + (i / PARTICLE_COUNT) * 140; // Xanh ngọc sang tím hồng
        }
      }
    }
    setTargetShape(0);

    function switchShape() {
      currentShape = (currentShape + 1) % 3;
      setTargetShape(currentShape);
      createShockwave(W / 2, H * 0.38);
      playChime(659.25);
    }

    // Sóng xung kích ánh sáng
    function createShockwave(x, y) {
      shockwaves.push({ x, y, radius: 10, alpha: 0.9 });
    }

    // Đom đóm bay lên khi thả trôi muộn phiền
    function spawnFireflies(x, y, count = 35) {
      for (let i = 0; i < count; i++) {
        fireflies.push({
          x: x + (Math.random() - 0.5) * 120,
          y: y,
          vx: (Math.random() - 0.5) * 2.5,
          vy: -(Math.random() * 3.5 + 1.5),
          size: Math.random() * 3 + 1.5,
          life: 1,
          hue: Math.random() * 45 + 25
        });
      }
    }

    // Tương tác xoay 3D bằng chuột / cảm ứng
    let rotY = 0, rotX = 0.2;
    let targetRotY = 0, targetRotX = 0.2;
    let isDragging = false, lastX = 0, lastY = 0;

    window.addEventListener('pointerdown', e => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });
    window.addEventListener('pointermove', e => {
      if (!isDragging) return;
      targetRotY += (e.clientX - lastX) * 0.008;
      targetRotX += (e.clientY - lastY) * 0.008;
      lastX = e.clientX;
      lastY = e.clientY;
    });
    window.addEventListener('pointerup', () => isDragging = false);

    // Nút nhận năng lượng
    function boostEnergy() {
      showNextQuote();
      createShockwave(W / 2, H * 0.38);
      spawnFireflies(W / 2, H * 0.42, 45);
      playChime(880);
      // Đẩy các hạt bung nhẹ ra rồi hút lại
      particles.forEach(p => {
        p.x *= 1.35;
        p.y *= 1.35;
        p.z *= 1.35;
      });
    }

    // Thả trôi muộn phiền
    function releaseWorry() {
      const input = document.getElementById('worryInput');
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }

      // Tạo hiệu ứng chữ bay lên mờ dần
      const rect = input.getBoundingClientRect();
      const floater = document.createElement('div');
      floater.className = 'dissolving-word';
      floater.innerText = `"${text}" ✨`;
      floater.style.left = (rect.left + 20) + 'px';
      floater.style.top = rect.top + 'px';
      document.body.appendChild(floater);
      setTimeout(() => floater.remove(), 2200);

      spawnFireflies(rect.left + rect.width / 2, rect.top, 40);
      createShockwave(W / 2, H * 0.38);
      playChime(523.25);

      input.value = '';
      showNextQuote("Muộn phiền ấy đã hóa thành bụi sao bay đi mất rồi. Nhẹ lòng hơn chưa nào? 🤍");
    }

    // Vòng lặp vẽ 60fps
    function render() {
      ctx.fillStyle = 'rgba(6, 4, 16, 0.28)'; // Tạo vệt mờ chuyển động (motion trail)
      ctx.fillRect(0, 0, W, H);

      if (!isDragging) targetRotY += 0.006; // Tự xoay êm ái
      rotY += (targetRotY - rotY) * 0.08;
      rotX += (targetRotX - rotX) * 0.08;

      const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
      const centerX = W / 2;
      const centerY = H * 0.38;
      const fov = 420;

      // Sắp xếp hạt theo chiều sâu Z để vẽ chuẩn 3D
      const projected = particles.map(p => {
        p.x += (p.tx - p.x) * 0.06;
        p.y += (p.ty - p.y) * 0.06;
        p.z += (p.tz - p.z) * 0.06;

        // Xoay quanh trục Y và X
        let x1 = p.x * cosY - p.z * sinY;
        let z1 = p.z * cosY + p.x * sinY;
        let y2 = p.y * cosX - z1 * sinX;
        let z2 = z1 * cosX + p.y * sinX;

        const scale = fov / (fov + z2 + 220);
        return {
          sx: centerX + x1 * scale,
          sy: centerY + y2 * scale,
          sz: z2,
          size: p.size * scale,
          hue: p.hue,
          alpha: Math.min(1, Math.max(0.2, scale * 0.9))
        };
      });

      projected.sort((a, b) => b.sz - a.sz);

      for (const pt of projected) {
        ctx.beginPath();
        ctx.arc(pt.sx, pt.sy, pt.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${pt.hue}, 95%, 72%, ${pt.alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = `hsla(${pt.hue}, 95%, 65%, 0.8)`;
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      // Vẽ sóng xung kích
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += 7;
        sw.alpha -= 0.022;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 215, 160, ${Math.max(0, sw.alpha)})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        if (sw.alpha <= 0) shockwaves.splice(i, 1);
      }

      // Vẽ đom đóm bay lên
      for (let i = fireflies.length - 1; i >= 0; i--) {
        const f = fireflies[i];
        f.x += f.vx + Math.sin(Date.now() * 0.005 + i) * 0.5;
        f.y += f.vy;
        f.life -= 0.014;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${f.hue}, 100%, 75%, ${Math.max(0, f.life)})`;
        ctx.fill();
        if (f.life <= 0) fireflies.splice(i, 1);
      }

      requestAnimationFrame(render);
    }
    render();

    // ==========================================
    // 3. ÂM NHẠC CHỮA LÀNH TỰ ĐỘNG (WEB AUDIO API)
    // ==========================================
    let audioCtx = null;
    let musicPlaying = false;
    let musicInterval = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playChime(freq = 587.33) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 2.2);
      } catch (e) {}
    }

    function toggleAmbientMusic() {
      const icon = document.getElementById('musicIcon');
      const label = document.getElementById('musicLabel');
      if (!musicPlaying) {
        initAudio();
        musicPlaying = true;
        icon.innerText = '🎵';
        label.innerText = 'Đang phát';
        // Hợp âm rải êm dịu (Fmaj7 - Cmaj7 - Am7 - G6)
        const scaleNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
        playChime(329.63);
        musicInterval = setInterval(() => {
          const note = scaleNotes[Math.floor(Math.random() * scaleNotes.length)];
          playChime(note);
        }, 1600);
      } else {
        musicPlaying = false;
        icon.innerText = '🔇';
        label.innerText = 'Nhạc chữa lành';
        clearInterval(musicInterval);
      }
    }
  </script>
</body>
</html>
